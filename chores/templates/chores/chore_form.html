{% extends "chores/base.html" %}

{% block title %}{{ form_title }}{% endblock %}

{% block content %}
  <h2>{{ form_title }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  {% if chore %}
    <p><a href="{% url 'chores:chore_detail' chore.pk %}">Back to chore</a></p>
  {% else %}
    <p><a href="{% url 'chores:home' %}">Back to home</a></p>
  {% endif %}
{% endblock %}
